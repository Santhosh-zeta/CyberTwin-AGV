<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTwin - AGV Digital Twin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="app-container">
        <header class="top-nav glass-panel">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <h1>CyberTwin <span class="badge">AGV Dashboard</span></h1>
            </div>
            <div class="status-indicator">
                <div class="led" id="connection-led"></div>
                <span id="connection-status">Connecting...</span>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Left Column: Twin Visualization -->
            <section class="panel twin-panel glass-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-map-location-dot"></i> Live Digital Twin</h2>
                </div>
                <div class="canvas-container">
                    <canvas id="twinCanvas" width="600" height="400"></canvas>
                    <div class="overlay-stats">
                        <div class="stat">
                            <span class="label">X:</span> <span id="pos-x" class="value">0.00</span>m
                        </div>
                        <div class="stat">
                            <span class="label">Y:</span> <span id="pos-y" class="value">0.00</span>m
                        </div>
                        <div class="stat">
                            <span class="label">θ:</span> <span id="pos-theta" class="value">0.0</span>°
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Column: Status & Controls -->
            <div class="right-column">
                <!-- System Status -->
                <section class="panel status-panel glass-panel">
                    <div class="panel-header">
                        <h2><i class="fa-solid fa-server"></i> Telemetry</h2>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-icon"><i class="fa-solid fa-battery-half"></i></div>
                            <div class="metric-data">
                                <h3>Battery</h3>
                                <p id="battery-val">-- V</p>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="battery-fill" style="width: 0%;"></div>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-icon"><i class="fa-solid fa-gauge-high"></i></div>
                            <div class="metric-data">
                                <h3>Speed</h3>
                                <p id="speed-val">-- m/s</p>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div class="metric-data">
                                <h3>Obstacle</h3>
                                <p id="obstacle-val" class="safe">Clear</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Control Panel -->
                <section class="panel control-panel glass-panel">
                    <div class="panel-header">
                        <h2><i class="fa-solid fa-gamepad"></i> Manual Control</h2>
                    </div>
                    <div class="d-pad">
                        <button class="control-btn" id="btn-forward" onclick="sendCommand('FORWARD')"><i class="fa-solid fa-chevron-up"></i></button>
                        <div class="horizontal-btns">
                            <button class="control-btn" id="btn-left" onclick="sendCommand('LEFT')"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="control-btn stop-btn" id="btn-stop" onclick="sendCommand('STOP')"><i class="fa-solid fa-stop"></i></button>
                            <button class="control-btn" id="btn-right" onclick="sendCommand('RIGHT')"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                        <button class="control-btn" id="btn-backward" onclick="sendCommand('BACKWARD')"><i class="fa-solid fa-chevron-down"></i></button>
                    </div>
                    <div class="mission-controls">
                        <button class="action-btn primary" onclick="sendCommand('START_MISSION')">Start Mission</button>
                        <button class="action-btn danger" onclick="sendCommand('ABORT')">Abort</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
